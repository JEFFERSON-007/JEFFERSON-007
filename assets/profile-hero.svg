  <text x="1365" y="472" text-anchor="end" fill="#75afc5" fill-opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">JR / 2026</text>
</svg>
